name: Kintsugi-AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx statsmodels

      - name: Run 3-Tier Test Suite (Unit, Integration & System/Web E2E)
        env:
          CLUSTER_MODE: REPLAY_HOLDOUT
          LLM_PROVIDER: groq
        run: |
          python -m pytest tests/ -v
          python scripts/test_remediation_agent.py

      - name: Verify Frontend Production Bundle Exists
        run: |
          test -f frontend/dist/index.html
