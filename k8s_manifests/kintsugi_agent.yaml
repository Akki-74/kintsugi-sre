---
apiVersion: v1
kind: Namespace
metadata:
  name: hipster
  labels:
    app.kubernetes.io/part-of: online-boutique
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kintsugi-ai-agent
  namespace: hipster
  labels:
    app: kintsugi-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kintsugi-ai
  template:
    metadata:
      labels:
        app: kintsugi-ai
    spec:
      serviceAccountName: kintsugi-sre-agent
      containers:
        - name: agent
          image: ghcr.io/akki-74/kintsugi-sre:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: LM_STUDIO_BASE_URL
              value: "http://host.docker.internal:1234/v1"
            - name: GROQ_API_KEY
              value: ""
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kintsugi-ai-service
  namespace: hipster
spec:
  type: ClusterIP
  selector:
    app: kintsugi-ai
  ports:
    - name: http
      port: 8000
      targetPort: 8000
