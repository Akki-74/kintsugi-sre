apiVersion: v1
kind: Namespace
metadata:
  name: hipster
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hipster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: server
        image: python:3.11-alpine
        command: ["python", "-u", "-c", "import time, json; \nwhile True:\n print(json.dumps({'message':'TraceID: 01f6 SpanID: 5e0c Request complete','severity':'info','http.resp.status':200,'http.resp.took_ms':11})); time.sleep(5)"]
        resources:
          requests:
            cpu: "20m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
---
