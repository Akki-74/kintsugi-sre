# OnlineBoutique Target Microservices Deployment Spec for kind/k8s cluster
apiVersion: v1
kind: Namespace
metadata:
  name: hipster
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hipster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: server
          image: gcr.io/google-samples/microservices-demo/frontend:v0.8.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
