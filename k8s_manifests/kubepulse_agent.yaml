---
apiVersion: v1
kind: Namespace
metadata:
  name: hipster
  labels:
    app.kubernetes.io/part-of: online-boutique
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubepulse-sre-agent
  namespace: hipster
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubepulse-sre-agent-role
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "nodes"]
    verbs: ["get", "list", "watch", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubepulse-sre-agent-binding
subjects:
  - kind: ServiceAccount
    name: kubepulse-sre-agent
    namespace: hipster
roleRef:
  kind: ClusterRole
  name: kubepulse-sre-agent-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubepulse-ai-agent
  namespace: hipster
  labels:
    app: kubepulse-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubepulse-ai
  template:
    metadata:
      labels:
        app: kubepulse-ai
    spec:
      serviceAccountName: kubepulse-sre-agent
      containers:
        - name: agent
          image: ghcr.io/kubepulse-ai/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: LM_STUDIO_URL
              value: "http://host.docker.internal:1234/v1/chat/completions"
            - name: GROQ_API_KEY
              value: ""
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kubepulse-ai-service
  namespace: hipster
spec:
  type: ClusterIP
  selector:
    app: kubepulse-ai
  ports:
    - name: http
      port: 8000
      targetPort: 8000
