apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubepulse-sre-agent
  namespace: hipster

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubepulse-remediation-role
  namespace: hipster
rules:
  # Allows scaling and patching deployments in hipster namespace
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]

  # Allows pod rolling restart and inspecting pod status
  - apiGroups: [""]
    resources: ["pods", "pods/status", "pods/log", "events", "configmaps"]
    verbs: ["get", "list", "watch", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubepulse-remediation-binding
  namespace: hipster
subjects:
  - kind: ServiceAccount
    name: kubepulse-sre-agent
    namespace: hipster
roleRef:
  kind: Role
  name: kubepulse-remediation-role
  apiGroup: rbac.authorization.k8s.io
