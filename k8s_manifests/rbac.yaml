apiVersion: v1
kind: ServiceAccount
metadata:
  name: kintsugi-sre-agent
  namespace: hipster
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kintsugi-remediation-role
rules:
  # Pod operations (Restarting crashing pods, inspecting logs)
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "delete"]
  # Node operations (Cordoning degraded worker nodes)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
  # Deployment operations (Horizontal scaling, resource patch limits)
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # Traffic Shaping (NetworkPolicy injection)
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kintsugi-remediation-binding
subjects:
  - kind: ServiceAccount
    name: kintsugi-sre-agent
    namespace: hipster
roleRef:
  kind: ClusterRole
  name: kintsugi-remediation-role
  apiGroup: rbac.authorization.k8s.io
